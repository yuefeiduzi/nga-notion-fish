        <script>
            // 伪造 NGA 的站点数据：合集页的 topicArg[7] 是**母版块**的 fid（真机实测如此），[8] 是 tid
            (function () {
                if (/nopostarg=1/.test(location.search)) return;
                var data = {};
                Array.prototype.forEach.call(document.querySelectorAll('#topicrows > tbody > tr'), function (row, index) {
                    var title = row.querySelector('td.c2 a.topic');
                    if (!title) return;
                    var author = row.querySelector('td.c3 a.author');
                    var item = [];
                    item[1] = title;
                    item[2] = author;
                    item[7] = -7;
                    item[8] = Number((title.getAttribute('href').match(/tid=(\d+)/) || [])[1] || 0);
                    data[index] = item;
                });
                window.commonui = window.commonui || {};
                window.commonui.topicArg = { data: data };
                window.__PAGE = ['/thread.php?stid=47554235', 2, 1, 0];
            })();
