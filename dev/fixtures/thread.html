            Array.prototype.forEach.call(document.querySelectorAll('template[id^="content"]'), function (tpl) {

                if (target) target.innerHTML = tpl.innerHTML;

        <script>
            // 复刻 NGA 的图片懒加载：滚进视口才把真地址写进 src（供唤醒流程测试）
            (function () {
                var img = document.getElementById('lazyTestImg');
                if (!img) return;
                var fill = function () {
                    var rect = img.getBoundingClientRect();
                    if (img.getAttribute('src') === 'about:blank' && rect.top < innerHeight && rect.bottom > 0) {
                        img.setAttribute('src', '/dev/fixtures/loop.png');
                    }
                };
                window.addEventListener('scroll', fill);
                setInterval(fill, 300);
            })();
        </script>

        <script>
            // 伪造 NGA 自己挂在页面上的数据（真实站点由 NGA 的 JS 构建）
            (function () {
                if (/nopostarg=1/.test(location.search)) return;
                var data = {};
                var rows = document.querySelectorAll('tr.postrow');
                rows.forEach(function (row, index) {
                    var uid = row.querySelector('.posterinfo .author');
                    data[index] = {
                        pid: 987654321 + index,
                        pAid: Number((uid.getAttribute('href').match(/uid=(\d+)/) || [])[1] || 0),
                        i: index,
                        lite: false,
                        uInfoC: row.querySelector('.posterinfo'),
                        subjectC: row.querySelector('[id^="postsubject"]'),
                        contentC: row.querySelector('[id^="postcontent"]'),
                    };
                });
                window.commonui = window.commonui || {};
                window.commonui.postArg = { data: data };
                window.commonui.topicArg = { data: {} };
                window.__PAGE = ['/read.php?tid=1234567', 9, 1, 0];
